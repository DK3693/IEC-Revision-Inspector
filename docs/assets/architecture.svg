<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img"><title>FOREWORD-first revision analysis architecture</title><rect width="100%" height="100%" fill="#f3f5f7"/><text x="36" y="57" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#17283b">From document structure to reviewable evidence</text><text x="36" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#62748a">Deterministic geometry • Structured interpretation • Human verification</text><rect x="40" y="135" width="370" height="151" rx="8" fill="#ffffff" stroke="#dce3eb"/><text x="62" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#356fdf">01 / DOCUMENT INPUT</text><text x="62" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#17283b">OLD + NEW editions</text><text x="62" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62748a">Text, typography and tables</text><rect x="450" y="135" width="370" height="151" rx="8" fill="#ffffff" stroke="#dce3eb"/><text x="472" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#356fdf">02 / STRUCTURE</text><text x="472" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#17283b">Align clauses and paragraphs</text><text x="472" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62748a">Preserve page / line / word boxes</text><rect x="860" y="135" width="370" height="151" rx="8" fill="#ffffff" stroke="#dce3eb"/><text x="882" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#356fdf">03 / CHANGE CANDIDATES</text><text x="882" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#17283b">Text, tables and relocations</text><text x="882" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62748a">Attach both source locations</text><rect x="40" y="365" width="370" height="151" rx="8" fill="#ffffff" stroke="#dce3eb"/><text x="62" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#356fdf">04 / FOREWORD SCOPE</text><text x="62" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#17283b">Declarations and target regions</text><text x="62" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62748a">Dynamic item-specific criteria</text><rect x="450" y="365" width="370" height="151" rx="8" fill="#ffffff" stroke="#dce3eb"/><text x="472" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#356fdf">05 / LOCAL INFERENCE</text><text x="472" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#17283b">Confirm and group evidence</text><text x="472" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62748a">Contextual reading + explanations</text><rect x="860" y="365" width="370" height="151" rx="8" fill="#ffffff" stroke="#dce3eb"/><text x="882" y="397" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#356fdf">06 / REVIEW OUTPUT</text><text x="882" y="437" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#17283b">HTML, JSON and PDF</text><text x="882" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#62748a">Change-specific BBox navigation</text><path d="M410 210 H450" fill="none" stroke="#7992af" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 210 H860" fill="none" stroke="#7992af" stroke-width="2" marker-end="url(#arrow)"/><path d="M1045 286 V329 H635 V365" fill="none" stroke="#7992af" stroke-width="2" marker-end="url(#arrow)"/><path d="M225 286 V365" fill="none" stroke="#7992af" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 440 H450" fill="none" stroke="#7992af" stroke-width="2" marker-end="url(#arrow)"/><path d="M820 440 H860" fill="none" stroke="#7992af" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#7992af"/></marker></defs><text x="40" y="565" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#62748a">Code owns source coordinates. Model responses supply interpretation. Reviewers retain the final judgement.</text></svg>