<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IEC Revision Inspector — Synthetic Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17283b;font:16px/1.7 system-ui,sans-serif}header{background:#101b2d;color:white;padding:20px 30px}header span{float:right;color:#a8bed7;font-size:13px}main{display:grid;grid-template-columns:260px 1fr;gap:24px;max-width:1400px;margin:auto;padding:30px}button{font:inherit;cursor:pointer;border:1px solid #dce3eb;background:white;border-radius:8px;padding:14px;text-align:left;color:inherit}nav button{display:block;width:100%;margin-bottom:12px}nav button[aria-pressed=true]{background:#e8f0ff;border-color:#356fdf}.card{background:white;border:1px solid #dce3eb;padding:24px;border-radius:10px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px}.muted{color:#62748a;font-size:14px}.panes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.paper{background:white;border:1px solid #dce3eb;padding:30px;min-height:440px}.bar{height:6px;background:#d8e0e8;margin:15px 0;border-radius:3px}.bbox{border:2px solid #356fdf;background:#eef4ff;padding:18px;margin:35px 0}.bbox.off{border-color:transparent;background:white}footer{padding:24px;color:#62748a;font-size:13px}#toggle{margin-top:15px} @media(max-width:850px){main{grid-template-columns:1fr}.panes{grid-template-columns:1fr}header span{float:none;display:block}}
</style></head><body><header><b>IEC REVISION INSPECTOR</b><span>SYNTHETIC DATA · PUBLIC DEMONSTRATION</span></header><main><nav aria-label="선언 항목"><h2>FOREWORD</h2><button data-i="0" aria-pressed="true">a) 절차 문구 명확화</button><button data-i="1" aria-pressed="false">b) 용어 위치 통합</button><button data-i="2" aria-pressed="false">c) 시험 방법 추가</button><p class="muted">모든 문구와 페이지는 가상 데이터입니다. 실제 실행 결과나 원문 캡처가 아닙니다.</p></nav><section><div class="card"><h1 id="title"></h1><p id="summary"></p><span class="muted" id="route"></span><br><button id="toggle" aria-pressed="true">BBox 표시 켜짐</button></div><div class="panes"><div><h2>OLD · 이전판</h2><article class="paper"><h3 id="oldhead"></h3><div class="bar"></div><div class="bar" style="width:75%"></div><div class="bar"></div><div class="bbox" id="oldtext"></div><div class="bar"></div><div class="bar" style="width:85%"></div><p class="muted">Fictitious document · No private content</p></article></div><div><h2>NEW · 개정판</h2><article class="paper"><h3 id="newhead"></h3><div class="bar"></div><div class="bar" style="width:75%"></div><div class="bar"></div><div class="bbox" id="newtext"></div><div class="bar"></div><div class="bar" style="width:85%"></div><p class="muted">Fictitious document · No private content</p></article></div></div></section></main><footer>독립형 공개 예시 · 외부 요청 없음 · 실제 제품 기능의 검토 흐름을 재현한 데모</footer><script>
const rows=[{title:'a)-01 절차 문구 명확화',summary:'가상 예시: 측정 기록에 명시된 시험 조건을 연결하여 검토합니다.',route:'MODIFY · 4.2 → 4.2',oldhead:'4.2 Procedure',newhead:'4.2 Procedure',oldtext:'Record the measured value.',newtext:'Record the measured value and the selected test condition.'},{title:'b)-01 용어 정의의 위치 이동',summary:'가상 예시: 정의의 내용과 두 판의 서로 다른 절 위치를 함께 확인합니다.',route:'MOVE · 8.2 → 3.4',oldhead:'8.2 Example term',newhead:'3.4 Example term',oldtext:'Example term: a named quantity used in this demonstration.',newtext:'Example term: a named quantity used in this demonstration.'},{title:'c)-01 시험 방법 신설',summary:'가상 예시: 이전판의 삽입 경계와 개정판의 신설 내용을 연결합니다.',route:'ADD · insertion boundary → Annex C',oldhead:'Insertion boundary',newhead:'Annex C Example method',oldtext:'No corresponding text. Structural insertion boundary.',newtext:'Apply the demonstration sequence and record the result.'}];
function choose(i){const row=rows[i];for(const key of ['title','summary','route','oldhead','newhead','oldtext','newtext'])document.getElementById(key).textContent=row[key];document.querySelectorAll('nav button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));document.getElementById('toggle').onclick=function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(on));this.textContent=on?'BBox 표시 켜짐':'BBox 표시 꺼짐';document.querySelectorAll('.bbox').forEach(x=>x.classList.toggle('off',!on));};choose(0);
</script></body></html>
